name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from app/build.gradle, e.g. v0.10.5)'
        required: false
        default: ''
      release_name:
        description: 'Release Title (leave empty for "OriginCTS <tag>")'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Auto-detect App Version
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/" | tr -d '[:space:]')
          VERSION_CODE=$(grep "versionCode" app/build.gradle | sed -E "s/.*versionCode ([0-9]+).*/\1/" | tr -d '[:space:]')

          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi

          if [ -n "${{ inputs.release_name }}" ]; then
            TITLE="${{ inputs.release_name }}"
          else
            TITLE="OriginCTS ${TAG}"
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${TITLE}" >> $GITHUB_ENV

          echo "Detected version: ${VERSION_NAME} (code ${VERSION_CODE})"
          echo "Target tag: ${TAG}"
          echo "Release title: ${TITLE}"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          NAMED_APK="OriginCTS-${{ env.TAG_NAME }}.apk"

          cp "$RELEASE_APK" "$NAMED_APK"
          sha256sum "$NAMED_APK" > "${NAMED_APK}.sha256"

          echo "Release APK prepared: $NAMED_APK"
          cat "${NAMED_APK}.sha256"

      - name: Upload Build Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: OriginCTS-${{ env.TAG_NAME }}
          path: |
            OriginCTS-${{ env.TAG_NAME }}.apk
            OriginCTS-${{ env.TAG_NAME }}.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            OriginCTS-${{ env.TAG_NAME }}.apk
            OriginCTS-${{ env.TAG_NAME }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
